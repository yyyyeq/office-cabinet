<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辦公室低值品鐵櫃管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #ECEAE4;
    }
    .cabinet-shell {
      background: linear-gradient(145deg, #FAF8F5 0%, #EDE9E1 100%);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.2), 0 0 0 2px #DFD9CE inset;
    }
    .door-left-box {
      border-right: 2px solid #D6D1C7;
      background: linear-gradient(180deg, #F9F8F5 0%, #EDE8DF 100%);
    }
    .door-right-box {
      border-left: 2px solid #D6D1C7;
      background: linear-gradient(180deg, #F9F8F5 0%, #EDE8DF 100%);
    }
    .metal-handle {
      background: linear-gradient(180deg, #E4E4E7 0%, #A1A1AA 60%, #71717A 100%);
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .louver {
      background: #71717A;
      height: 3px;
      border-radius: 2px;
      opacity: 0.25;
      margin-bottom: 4px;
    }
    .compartment-card {
      background: #EAE6DE;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.08), inset -1px -1px 2px rgba(255,255,255,0.7);
      transition: transform 0.15s, background-color 0.15s;
    }
    .compartment-card:hover {
      background: #E1DDD3;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen text-stone-800 flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white/90 backdrop-blur border-b border-stone-200 sticky top-0 z-50 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🗄️</span>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-stone-800 flex items-center gap-2">
            辦公室低值品鐵櫃
            <span id="sync-status" class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-normal">
              ● 系統就緒
            </span>
          </h1>
          <p class="text-xs text-stone-500 hidden sm:block">點擊櫃門開闔・借還管理</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="main-door-btn" class="px-4 py-2 text-xs sm:text-sm font-bold rounded-lg bg-stone-800 text-white hover:bg-stone-700 shadow transition active:scale-95">
          🚪 打開鐵櫃
        </button>
        <button id="main-loan-btn" class="px-3 py-2 text-xs sm:text-sm font-medium rounded-lg bg-amber-100 text-amber-900 hover:bg-amber-200 border border-amber-200 transition">
          📋 借還登記冊 (<span id="loan-count-badge">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- 主畫面 -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col items-center justify-center">

    <div class="w-full relative mb-3 flex justify-between items-center text-xs text-stone-600 px-1">
      <div class="flex items-center gap-2">
        <span class="font-bold">米白烤漆雙開鐵櫃</span>
        <span>|</span>
        <span id="status-hint" class="text-amber-800 font-medium">👉 請點擊櫃門或右上角按鈕打開</span>
      </div>
      <div id="breadcrumb-area" style="display:none;" class="items-center gap-1">
        <button id="btn-back-all" class="text-amber-800 underline font-bold">全櫃 6 格</button>
        <span>/</span>
        <span id="current-compartment-label" class="font-bold text-stone-800"></span>
      </div>
    </div>

    <!-- 鐵櫃主體外框 -->
    <div class="cabinet-shell w-full rounded-2xl border-4 border-[#DFD9CE] min-h-[560px] p-4 sm:p-6 relative overflow-hidden flex flex-col justify-between">

      <!-- 視圖 A：閉合狀態的大鐵櫃門片 (預設顯示) -->
      <div id="closed-doors-view" class="grid grid-cols-2 gap-0 w-full flex-1 cursor-pointer select-none rounded-xl overflow-hidden shadow-inner border border-stone-300">
        <!-- 左門 -->
        <div class="door-left-box p-6 flex flex-col justify-between hover:brightness-[0.98] transition">
          <div class="w-16">
            <div class="louver"></div><div class="louver"></div><div class="louver"></div>
          </div>
          <div class="bg-stone-100/90 border border-stone-300 p-3 rounded shadow-sm max-w-[180px]">
            <div class="text-[10px] text-stone-400 font-bold uppercase">OFFICE STORAGE</div>
            <div class="text-xs font-bold text-stone-800">低值品管理櫃</div>
            <div class="text-[11px] text-amber-700 mt-1 font-semibold">點此處直接打開 🔑</div>
          </div>
          <div class="flex justify-end items-center">
            <div class="metal-handle w-3.5 h-20 rounded-full mr-2"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-stone-700"></div>
          </div>
          <div class="w-16">
            <div class="louver"></div><div class="louver"></div>
          </div>
        </div>

        <!-- 右門 -->
        <div class="door-right-box p-6 flex flex-col justify-between hover:brightness-[0.98] transition">
          <div class="w-16 self-end">
            <div class="louver"></div><div class="louver"></div><div class="louver"></div>
          </div>
          <div class="self-end bg-amber-50 border border-amber-200 p-2.5 rounded shadow-sm max-w-[170px]">
            <div class="text-[11px] text-amber-900 font-bold">📌 線材用畢請歸位</div>
            <div class="text-[10px] text-stone-500">點此處直接打開</div>
          </div>
          <div class="flex items-center">
            <div class="metal-handle w-3.5 h-20 rounded-full ml-2"></div>
          </div>
          <div class="w-16 self-end">
            <div class="louver"></div><div class="louver"></div>
          </div>
        </div>
      </div>

      <!-- 視圖 B：內部 6 格收納空間 (開門後顯示) -->
      <div id="grid-view" style="display:none;" class="grid grid-cols-1 md:grid-cols-3 gap-4 h-full flex-1">
        <!-- 上 3 格 -->
        <div data-cab="top-left" class="cab-grid-btn compartment-card rounded-xl p-3.5 flex flex-col cursor-pointer border border-stone-300">
          <div class="flex justify-between items-center pb-2 border-b border-stone-300">
            <span class="text-xs font-bold bg-stone-200 text-stone-700 px-2 py-0.5 rounded">左上櫃</span>
            <span id="count-top-left" class="text-xs bg-white/80 px-2 py-0.5 rounded-full text-stone-600 font-bold">4 項</span>
          </div>
          <div id="preview-top-left" class="flex-1 mt-2 text-xs text-stone-500 flex flex-col gap-1"></div>
          <div class="text-[11px] text-amber-800 font-bold mt-2">進入此櫃 →</div>
        </div>

        <div data-cab="top-center" class="cab-grid-btn compartment-card rounded-xl p-3.5 flex flex-col cursor-pointer border border-stone-300">
          <div class="flex justify-between items-center pb-2 border-b border-stone-300">
            <span class="text-xs font-bold bg-stone-200 text-stone-700 px-2 py-0.5 rounded">中上櫃</span>
            <span id="count-top-center" class="text-xs bg-white/80 px-2 py-0.5 rounded-full text-stone-600 font-bold">9 項</span>
          </div>
          <div id="preview-top-center" class="flex-1 mt-2 text-xs text-stone-500 flex flex-col gap-1"></div>
          <div class="text-[11px] text-amber-800 font-bold mt-2">進入此櫃 →</div>
        </div>

        <div data-cab="top-right" class="cab-grid-btn compartment-card rounded-xl p-3.5 flex flex-col cursor-pointer border border-stone-300">
          <div class="flex justify-between items-center pb-2 border-b border-stone-300">
            <span class="text-xs font-bold bg-stone-200 text-stone-700 px-2 py-0.5 rounded">右上櫃</span>
            <span id="count-top-right" class="text-xs bg-white/80 px-2 py-0.5 rounded-full text-stone-600 font-bold">15 項</span>
          </div>
          <div id="preview-top-right" class="flex-1 mt-2 text-xs text-stone-500 flex flex-col gap-1"></div>
          <div class="text-[11px] text-amber-800 font-bold mt-2">進入此櫃 →</div>
        </div>

        <!-- 下 3 格 -->
        <div data-cab="bottom-left" class="cab-grid-btn compartment-card rounded-xl p-3.5 flex flex-col cursor-pointer border border-stone-300">
          <div class="flex justify-between items-center pb-2 border-b border-stone-300">
            <span class="text-xs font-bold bg-stone-200 text-stone-700 px-2 py-0.5 rounded">左下櫃</span>
            <span id="count-bottom-left" class="text-xs bg-white/80 px-2 py-0.5 rounded-full text-stone-600 font-bold">7 項</span>
          </div>
          <div id="preview-bottom-left" class="flex-1 mt-2 text-xs text-stone-500 flex flex-col gap-1"></div>
          <div class="text-[11px] text-amber-800 font-bold mt-2">進入此櫃 →</div>
        </div>

        <div data-cab="bottom-center" class="cab-grid-btn compartment-card rounded-xl p-3.5 flex flex-col cursor-pointer border border-stone-300">
          <div class="flex justify-between items-center pb-2 border-b border-stone-300">
            <span class="text-xs font-bold bg-stone-200 text-stone-700 px-2 py-0.5 rounded">中下櫃 (下中)</span>
            <span id="count-bottom-center" class="text-xs bg-white/80 px-2 py-0.5 rounded-full text-stone-600 font-bold">7 項</span>
          </div>
          <div id="preview-bottom-center" class="flex-1 mt-2 text-xs text-stone-500 flex flex-col gap-1"></div>
          <div class="text-[11px] text-amber-800 font-bold mt-2">進入此櫃 →</div>
        </div>

        <div data-cab="bottom-right" class="cab-grid-btn compartment-card rounded-xl p-3.5 flex flex-col cursor-pointer border border-stone-300">
          <div class="flex justify-between items-center pb-2 border-b border-stone-300">
            <span class="text-xs font-bold bg-stone-200 text-stone-700 px-2 py-0.5 rounded">右下櫃 (下右)</span>
            <span id="count-bottom-right" class="text-xs bg-white/80 px-2 py-0.5 rounded-full text-stone-600 font-bold">12 項</span>
          </div>
          <div id="preview-bottom-right" class="flex-1 mt-2 text-xs text-stone-500 flex flex-col gap-1"></div>
          <div class="text-[11px] text-amber-800 font-bold mt-2">進入此櫃 →</div>
        </div>
      </div>

      <!-- 視圖 C：單格清單 -->
      <div id="single-view" style="display:none;" class="flex-col h-full flex-1">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-stone-300">
          <div class="flex items-center gap-3">
            <button id="btn-back-single" class="text-xs px-3 py-1.5 rounded-lg bg-stone-200 hover:bg-stone-300 text-stone-800 font-bold">← 返回全櫃</button>
            <h2 id="single-title" class="text-base font-bold text-stone-800">櫃位內容</h2>
            <span id="single-count" class="text-xs bg-white px-2 py-0.5 rounded-full text-stone-600 border">0 樣品項</span>
          </div>
          <div>
            <input type="text" id="search-box" placeholder="搜尋此櫃物品..." class="text-xs px-3 py-1.5 rounded-lg border border-stone-300 bg-white">
          </div>
        </div>
        <div id="items-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 overflow-y-auto max-h-[480px]"></div>
      </div>

    </div>
  </main>

  <input type="file" id="file-input" accept="image/*" class="hidden">

  <!-- 登記借出彈窗 -->
  <div id="loan-popup" style="display:none;" class="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-sm text-stone-800">📝 登記借出</h3>
        <button id="close-loan-x" class="text-stone-400 hover:text-stone-600 text-lg">&times;</button>
      </div>
      <div class="text-xs bg-stone-50 p-2.5 rounded border mb-3">
        <div class="font-bold text-stone-800" id="popup-item-name"></div>
        <div class="text-stone-500 text-[11px]" id="popup-stock"></div>
      </div>
      <form id="loan-form" class="space-y-3">
        <input type="hidden" id="loan-item-id">
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">借用人姓名</label>
          <input type="text" id="loan-name" required placeholder="如：David、雅庭" class="w-full text-xs px-3 py-2 rounded border">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">借出數量</label>
            <input type="number" id="loan-qty" min="1" value="1" required class="w-full text-xs px-3 py-2 rounded border">
          </div>
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">借出日期</label>
            <input type="date" id="loan-day" required class="w-full text-xs px-2 py-2 rounded border">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">用途備註</label>
          <input type="text" id="loan-note" placeholder="例如：會議室接電視" class="w-full text-xs px-3 py-2 rounded border">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" id="close-loan-btn" class="flex-1 py-2 text-xs border rounded text-stone-600">取消</button>
          <button type="submit" class="flex-1 py-2 text-xs bg-stone-800 text-white rounded font-bold">確認借出</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 借還冊彈窗 -->
  <div id="history-popup" style="display:none;" class="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-xl w-full p-5 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="font-bold text-sm text-stone-800">📋 低值品借還登記冊</h3>
        <button id="close-history-x" class="text-stone-400 text-lg">&times;</button>
      </div>
      <div class="overflow-y-auto flex-1 my-2">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-stone-50 border-b text-stone-500">
              <th class="py-2 px-2">日期</th>
              <th class="py-2 px-2">借用人</th>
              <th class="py-2 px-2">品項</th>
              <th class="py-2 px-2">數量</th>
              <th class="py-2 px-2 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="history-table-body" class="divide-y divide-stone-100"></tbody>
        </table>
      </div>
      <div class="pt-2 border-t flex justify-end">
        <button id="close-history-btn" class="px-4 py-1.5 text-xs bg-stone-100 rounded text-stone-700">關閉</button>
      </div>
    </div>
  </div>

  <script>

      { id: "item-030", cabinet: "top-right", name: "Mini DP(公) 轉 HDMI(母) 轉接器", count: 10, unit: "條", note: "料號 819406，白9、黑1", tag: "轉接器" },
      { id: "item-031", cabinet: "top-right", name: "紫米 65W 三孔快充頭 HA835", count: 1, unit: "個", note: "料號 5340001383", tag: "充電器" },
      { id: "item-032", cabinet: "top-right", name: "Apple 原廠 20W 充電頭", count: 3, unit: "個", note: "Type-C 單孔白頭", tag: "充電器" },
      { id: "item-033", cabinet: "top-right", name: "小米 36W 快充雙口充電器", count: 4, unit: "個", note: "料號 820528，未拆2、已拆2", tag: "充電器" },
      { id: "item-034", cabinet: "top-right", name: "USB 轉 DC/耳機孔充電線", count: 1, unit: "條", note: "白色細線", tag: "線材" },
      { id: "item-035", cabinet: "top-right", name: "會議室專用 vivo 充電頭＋線", count: 0, unit: "組", note: "勿拿！10/24已轉給 David 使用", tag: "出借中" },
      { id: "item-036", cabinet: "top-right", name: "Apple 96W 原廠充電器盒裝", count: 1, unit: "個", note: "2025/11/10 新購入", tag: "充電器" },
      { id: "item-037", cabinet: "top-right", name: "Apple 96W 原廠充電頭 (舊款)", count: 2, unit: "個", note: "裸機", tag: "充電器" },
      { id: "item-038", cabinet: "top-right", name: "Apple 61W 原廠充電頭 (舊款)", count: 1, unit: "個", note: "裸機", tag: "充電器" },
      { id: "item-039", cabinet: "top-right", name: "Apple Type-C to Lightning 充電線", count: 3, unit: "條", note: "短線1、長線2", tag: "線材" },
      { id: "item-040", cabinet: "top-right", name: "Type-C to Type-C 白色線", count: 1, unit: "條", note: "附魔鬼氈束帶", tag: "線材" },
      { id: "item-041", cabinet: "top-right", name: "Apple Type-C to Type-C 線 (損壞)", count: 1, unit: "條", note: "故障待報廢", tag: "損壞品" },

      { id: "item-042", cabinet: "top-center", name: "D-Link AC1300 雙頻 USB 網卡", count: 2, unit: "個", note: "DWA-182 盒裝", tag: "網通設備" },
      { id: "item-043", cabinet: "top-center", name: "D-Link 5埠 Gigabit 交換器", count: 1, unit: "台", note: "DGS-1005A 桌上型", tag: "網通設備" },
      { id: "item-044", cabinet: "top-center", name: "Iware 金屬折疊手機平板支架", count: 2, unit: "個", note: "金屬立體支架", tag: "辦公周邊" },
      { id: "item-045", cabinet: "top-center", name: "創見 4埠 USB 3.1 Hub (HUB3)", count: 1, unit: "個", note: "盒裝含獨立變壓器", tag: "轉接器" },
      { id: "item-046", cabinet: "top-center", name: "Ulanzi ST-02S 全金屬手機夾", count: 2, unit: "個", note: "冷靴攝影支架盒裝", tag: "攝影器材" },
      { id: "item-047", cabinet: "top-center", name: "Kingston 攜帶型 75% 酒精噴霧", count: 1, unit: "瓶", note: "金屬瓶身高質感攜帶款", tag: "防疫用品" },
      { id: "item-048", cabinet: "top-center", name: "創見可攜式 SSD 固態硬碟", count: 1, unit: "組", note: "含專用 Type-C 短線", tag: "儲存裝置" },
      { id: "item-049", cabinet: "top-center", name: "ENGINEER PTZ-61 日本防靜電鑷子", count: 2, unit: "支", note: "二號精密先細型夾子", tag: "工程工具" },
      { id: "item-050", cabinet: "top-center", name: "AMACHINE 11-in-1 Type-C 擴充座", count: 1, unit: "台", note: "多功能擴充塢", tag: "轉接器" },

      { id: "item-051", cabinet: "top-left", name: "聯想 ThinkPad 小紅點鍵盤帽", count: 9, unit: "顆", note: "料號 SM20S56933 替換用", tag: "耗材配件" },
      { id: "item-052", cabinet: "top-left", name: "USB 黑色粗線 (公對母延長)", count: 1, unit: "條", note: "黑色散裝粗線", tag: "線材" },
      { id: "item-053", cabinet: "top-left", name: "USB to Type-C 紅白雙色編織線", count: 1, unit: "條", note: "紅白相間款", tag: "線材" },
      { id: "item-054", cabinet: "top-left", name: "Keystone XLR 3針轉5針 音訊轉接頭", count: 1, unit: "個", note: "AUD621 公轉母金屬頭", tag: "音訊轉接" }
    ];

    let doorOpen = false;
    let currentCabKey = null;
    let loansList = [];
    let currentUploadId = null;

    // 開關門動作：直接切換視圖，絕無任何卡住可能
    function toggleDoor() {
      doorOpen = !doorOpen;
      const doorsView = document.getElementById('closed-doors-view');
      const gridView = document.getElementById('grid-view');
      const singleView = document.getElementById('single-view');
      const btn = document.getElementById('main-door-btn');
      const hint = document.getElementById('status-hint');

      if (doorOpen) {
        doorsView.style.display = 'none';
        gridView.style.display = 'grid';
        singleView.style.display = 'none';
        btn.innerText = '🔒 關閉鐵櫃';
        btn.className = 'px-4 py-2 text-xs sm:text-sm font-bold rounded-lg bg-amber-700 text-white hover:bg-amber-800 shadow transition';
        hint.innerText = '✅ 櫃門已開，點選任意櫃格檢視物品';
      } else {
        doorsView.style.display = 'grid';
        gridView.style.display = 'none';
        singleView.style.display = 'none';
        btn.innerText = '🚪 打開鐵櫃';
        btn.className = 'px-4 py-2 text-xs sm:text-sm font-bold rounded-lg bg-stone-800 text-white hover:bg-stone-700 shadow transition';
        hint.innerText = '👉 請點擊櫃門或右上角按鈕打開';
        document.getElementById('breadcrumb-area').style.display = 'none';
      }
    }

    // 進入單格
    function openCab(cabKey) {
      currentCabKey = cabKey;
      document.getElementById('grid-view').style.display = 'none';
      document.getElementById('single-view').style.display = 'flex';
      document.getElementById('breadcrumb-area').style.display = 'flex';
      document.getElementById('current-compartment-label').innerText = CABINET_MAP[cabKey];
      document.getElementById('single-title').innerText = CABINET_MAP[cabKey];
      renderItems(cabKey);
    }

    // 返回全櫃
    function backToAll() {
      currentCabKey = null;
      document.getElementById('grid-view').style.display = 'grid';
      document.getElementById('single-view').style.display = 'none';
      document.getElementById('breadcrumb-area').style.display = 'none';
    }

    // 預覽更新
    function updatePreviews() {
      const keys = ['top-left', 'top-center', 'top-right', 'bottom-left', 'bottom-center', 'bottom-right'];
      keys.forEach(k => {
        const its = allItems.filter(i => i.cabinet === k);
        const countEl = document.getElementById(`count-${k}`);
        const prevEl = document.getElementById(`preview-${k}`);
        if (countEl) countEl.innerText = `${its.length} 項`;
        if (prevEl) {
          prevEl.innerHTML = its.slice(0, 3).map(it => `
            <div class="truncate flex justify-between text-[11px]">
              <span class="truncate text-stone-700">• ${it.name}</span>
              <span class="text-stone-400 font-bold shrink-0">${it.count}</span>
            </div>
          `).join('') + (its.length > 3 ? `<span class="text-[10px] text-stone-400 italic">+ 還有 ${its.length - 3} 樣...</span>` : '');
        }
      });
    }

    // 渲染清單
    function renderItems(cabKey, keyword = '') {
      const list = document.getElementById('items-list');
      let its = allItems.filter(i => i.cabinet === cabKey);

      if (keyword.trim()) {
        const q = keyword.toLowerCase();
        its = its.filter(i => i.name.toLowerCase().includes(q) || (i.note && i.note.toLowerCase().includes(q)));
      }

      document.getElementById('single-count').innerText = `${its.length} 樣物品`;

      if (its.length === 0) {
        list.innerHTML = `<div class="col-span-full py-10 text-center text-xs text-stone-400">尚無物品</div>`;
        return;
      }

      list.innerHTML = its.map(it => `
        <div class="bg-white rounded-xl p-3 border border-stone-200 shadow-sm flex flex-col justify-between">
          <div class="flex items-start gap-2.5">
            <div class="w-14 h-14 rounded-lg bg-stone-100 border border-stone-200 shrink-0 overflow-hidden flex items-center justify-center relative group">
              ${it.image_url ? `<img src="${it.image_url}" class="w-full h-full object-cover">` : `<span class="text-2xl">${getEmoji(it.tag, it.name)}</span>`}
              <button onclick="changePhoto('${it.id}')" class="absolute inset-0 bg-stone-900/60 text-white text-[10px] opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition">
                <span>📷</span><span>換照</span>
              </button>
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-[10px] bg-stone-100 text-stone-600 px-1 py-0.5 rounded font-medium">${it.tag || '物料'}</span>
              ${it.note && it.note.includes('勿拿') ? '<span class="text-[10px] bg-rose-100 text-rose-700 px-1 py-0.5 rounded font-bold">勿拿</span>' : ''}
              <div class="text-xs font-bold text-stone-800 mt-1 truncate" title="${it.name}">${it.name}</div>
              <div class="text-[11px] text-stone-500 truncate mt-0.5">${it.note || '無備註'}</div>
            </div>
          </div>

          <div class="mt-3 pt-2 border-t border-stone-100 flex items-center justify-between">
            <div class="text-xs">
              <span class="text-stone-400">剩餘:</span>
              <span class="font-bold text-sm text-stone-800">${it.count}</span>
              <span class="text-stone-400 text-[11px]">${it.unit || '個'}</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="changeQty('${it.id}', -1)" class="w-6 h-6 rounded bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs">－</button>
              <button onclick="changeQty('${it.id}', 1)" class="w-6 h-6 rounded bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs">＋</button>
              <button onclick="openLoanPopup('${it.id}')" ${it.count <= 0 ? 'disabled' : ''} class="ml-1 text-xs px-2.5 py-1 rounded bg-stone-800 text-white font-medium hover:bg-stone-700 disabled:bg-stone-300">借出</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function getEmoji(tag, name) {
      if (name.includes('Apple')) return '🍎';
      if (name.includes('vivo')) return '📱';
      if (name.includes('小米') || name.includes('耳機')) return '🎧';
      if (name.includes('紅包')) return '🧧';
      if (name.includes('滑鼠')) return '🖱️';
      if (name.includes('硬碟')) return '💾';
      if (name.includes('支架')) return '📐';
      if (tag === '線材') return '🔌';
      if (tag === '轉接器') return '⚡';
      if (tag === '充電器') return '🔋';
      return '📦';
    }

    // 數量修改
    function changeQty(id, delta) {
      const it = allItems.find(i => i.id === id);
      if (!it) return;
      it.count = Math.max(0, it.count + delta);
      renderItems(currentCabKey);
      updatePreviews();
    }

    // 換照
    function changePhoto(id) {
      currentUploadId = id;
      document.getElementById('file-input').click();
    }

    // 借出彈窗
    function openLoanPopup(id) {
      const it = allItems.find(i => i.id === id);
      if (!it) return;
      document.getElementById('loan-item-id').value = it.id;
      document.getElementById('popup-item-name').innerText = it.name;
      document.getElementById('popup-stock').innerText = `現存庫存：${it.count} ${it.unit || '個'}`;
      document.getElementById('loan-qty').max = it.count;
      document.getElementById('loan-qty').value = 1;
      document.getElementById('loan-day').value = new Date().toISOString().split('T')[0];
      document.getElementById('loan-name').value = '';
      document.getElementById('loan-note').value = '';
      document.getElementById('loan-popup').style.display = 'flex';
    }

    function closeLoanPopup() {
      document.getElementById('loan-popup').style.display = 'none';
    }

    // 借還清單彈窗
    function openLoanModalList() {
      const tbody = document.getElementById('history-table-body');
      if (loansList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-stone-400">目前尚無借出紀錄</td></tr>`;
      } else {
        tbody.innerHTML = loansList.map(l => {
          const it = allItems.find(i => i.id === l.item_id) || { name: '未知物品' };
          const isBorrowed = l.status === 'borrowed';
          return `
            <tr>
              <td class="py-2 px-2">${l.date}</td>
              <td class="py-2 px-2 font-bold">${l.borrower}</td>
              <td class="py-2 px-2">${it.name}</td>
              <td class="py-2 px-2 font-bold">${l.amount}</td>
              <td class="py-2 px-2 text-right">
                ${isBorrowed ? `<button onclick="returnItemLoan('${l.id}', '${l.item_id}', ${l.amount})" class="px-2 py-0.5 bg-emerald-600 text-white rounded text-xs">歸還</button>` : '<span class="text-stone-400">已歸還</span>'}
              </td>
            </tr>
          `;
        }).join('');
      }
      document.getElementById('history-popup').style.display = 'flex';
    }

    function returnItemLoan(loanId, itemId, amount) {
      const it = allItems.find(i => i.id === itemId);
      if (it) it.count += amount;
      const loan = loansList.find(l => l.id === loanId);
      if (loan) loan.status = 'returned';
      document.getElementById('loan-count-badge').innerText = loansList.filter(l => l.status === 'borrowed').length;
      if (currentCabKey) renderItems(currentCabKey);
      updatePreviews();
      openLoanModalList();
    }

    // 綁定事件監聽（防止 HTML inline onclick 被阻斷）
    window.addEventListener('DOMContentLoaded', () => {
      // 門片點擊
      document.getElementById('main-door-btn').addEventListener('click', toggleDoor);
      document.getElementById('closed-doors-view').addEventListener('click', toggleDoor);

      // 返回按鈕
      document.getElementById('btn-back-all').addEventListener('click', backToAll);
      document.getElementById('btn-back-single').addEventListener('click', backToAll);

      // 6 格櫃點擊
      document.querySelectorAll('.cab-grid-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cab = btn.getAttribute('data-cab');
          openCab(cab);
        });
      });

      // 搜尋
      document.getElementById('search-box').addEventListener('input', (e) => {
        if (currentCabKey) renderItems(currentCabKey, e.target.value);
      });

      // 借還清單
      document.getElementById('main-loan-btn').addEventListener('click', openLoanModalList);
      document.getElementById('close-history-x').addEventListener('click', () => document.getElementById('history-popup').style.display = 'none');
      document.getElementById('close-history-btn').addEventListener('click', () => document.getElementById('history-popup').style.display = 'none');
      document.getElementById('close-loan-x').addEventListener('click', closeLoanPopup);
      document.getElementById('close-loan-btn').addEventListener('click', closeLoanPopup);

      // 登記借出提交
      document.getElementById('loan-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('loan-item-id').value;
        const borrower = document.getElementById('loan-name').value.trim();
        const date = document.getElementById('loan-day').value;
        const amount = parseInt(document.getElementById('loan-qty').value, 10);
        const purpose = document.getElementById('loan-note').value.trim();

        const it = allItems.find(i => i.id === id);
        if (!it || amount > it.count) {
          alert('借出量不得大於庫存！');
          return;
        }

        it.count -= amount;
        loansList.unshift({ id: 'loan-' + Date.now(), item_id: id, borrower, date, amount, purpose, status: 'borrowed' });
        document.getElementById('loan-count-badge').innerText = loansList.filter(l => l.status === 'borrowed').length;
        closeLoanPopup();
        renderItems(currentCabKey);
        updatePreviews();
      });

      // 本機拍照換照
      document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file || !currentUploadId) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          const it = allItems.find(i => i.id === currentUploadId);
          if (it) it.image_url = evt.target.result;
          renderItems(currentCabKey);
        };
        reader.readAsDataURL(file);
      });

      updatePreviews();
    });
  </script>
</body>
</html>
